# A push to main releases when the app's sources, build files or this workflow
# changed since the last release. The version is the calendar version
# metio/ci/calver computes; dev/set-version.sh writes it and its version code
# into app/build.gradle.kts in a release commit on top of the pushed commit.
# That commit is tagged with the version and never merged into main, so
# F-Droid finds literal versions in every tagged build file. The APK is signed
# with the release key from the secrets ANDROID_KEYSTORE (the PKCS#12
# keystore, base64) and ANDROID_KEYSTORE_PASSWORD, must carry the certificate
# named in SIGNER_SHA256, which F-Droid checks as well, and is published with
# a SHA256SUMS file signed by cosign.

name: Release
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # The pasejo revision whose pasejo-mobile the release builds.
  PASEJO_REF: 38ce8a61fdd9dd9f13ecfe83bb6baebcb26e4677
  NDK_VERSION: 30.0.16248370
  BUILD_TOOLS: 36.0.0
  SIGNER_SHA256: ff117c4cada7bdb1c000989519c95e3e2d0f0611520302495615346052d8a3ed

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      needed: ${{ steps.gate.outputs.needed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: gate
        name: Check for changes since the last release
        # Release tags sit on release commits outside main, so the last release
        # is the highest tag, and its parent is the main commit it was cut from.
        run: |
          set -euo pipefail
          last=$(git tag --list '20[0-9][0-9].*' --sort=-v:refname | head -n 1)
          if [ -z "$last" ]; then
            echo "no release yet"
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=0
          git diff --quiet "$last^" HEAD -- app build.gradle.kts settings.gradle.kts gradle.properties .github/workflows/release.yml || status=$?
          case "$status" in
            0) echo "nothing to release since $last"; echo "needed=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "changes since $last"; echo "needed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::git diff failed with status $status"; exit "$status" ;;
          esac
      - id: version
        if: steps.gate.outputs.needed == 'true'
        uses: metio/ci/calver@481c52330329f9256f7f3d895da0ff54ede66603 # 2026.11.23065533

  release:
    name: Release
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write # cosign keyless sign-blob
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Write the version
        run: |
          set -euo pipefail
          code=$(dev/set-version.sh "$VERSION")
          echo "version $VERSION, version code $code"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --all --message "chore: release $VERSION"
      - name: Checkout pasejo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: metio/pasejo
          ref: ${{ env.PASEJO_REF }}
          path: pasejo
          persist-credentials: false
      - uses: metio/ci/breto@481c52330329f9256f7f3d895da0ff54ede66603 # 2026.11.23065533
        with:
          registries: github:metio/toolchains
      - name: Set up Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "ndk;${NDK_VERSION}" "build-tools;${BUILD_TOOLS}"
      - name: Set up Rust targets
        working-directory: pasejo
        run: rustup target add aarch64-linux-android x86_64-linux-android
      - name: Build
        run: gradle --no-daemon -Ppasejo.dir=pasejo assembleRelease
      - name: Sign
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          keystore="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$keystore"' EXIT
          (umask 077; echo "$ANDROID_KEYSTORE" | base64 -d > "$keystore")
          mkdir dist
          apk="dist/pasejo-$VERSION.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --ks-key-alias pasejo \
            --out "$apk" app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f "$apk.idsig"
          signer=$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          [ "$signer" = "$SIGNER_SHA256" ] || { echo "::error::signed by $signer instead of $SIGNER_SHA256"; exit 1; }
      - name: Calculate checksums
        working-directory: dist
        run: sha256sum ./*.apk > SHA256SUMS
      - uses: metio/ci/cosign-sign-blob@481c52330329f9256f7f3d895da0ff54ede66603 # 2026.11.23065533
        with:
          file: dist/SHA256SUMS
      - name: Tag the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag "$VERSION"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "refs/tags/$VERSION"
      - name: Create the release
        run: |
          gh release create "$VERSION" --verify-tag --title "$VERSION" --generate-notes \
            --notes "Built against metio/pasejo@${PASEJO_REF}. The APK is signed by the certificate with SHA-256 \`${SIGNER_SHA256}\`." \
            dist/*
        env:
          GH_TOKEN: ${{ github.token }}
